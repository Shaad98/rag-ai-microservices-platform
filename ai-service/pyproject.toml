[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shaad98", email = "shaadbangi98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.103",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "py-eureka-client>=0.13.3",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ai-service = "ai_service:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
